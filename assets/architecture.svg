<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" role="img" aria-label="双链路架构图">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DA291C"/>
      <stop offset="100%" stop-color="#B01A0F"/>
    </linearGradient>
  </defs>
  <rect width="680" height="340" fill="#FFFFFF"/>

  <!-- 头部：麦当劳 MCP -->
  <rect x="24" y="20" width="632" height="60" rx="14" fill="url(#topbar)"/>
  <path d="M52 66 C52 44 58 34 64 34 C70 34 76 44 76 66" fill="none" stroke="#FFC72C" stroke-width="7" stroke-linecap="round"/>
  <path d="M80 66 C80 44 86 34 92 34 C98 34 104 44 104 66" fill="none" stroke="#FFC72C" stroke-width="7" stroke-linecap="round"/>
  <text x="120" y="47" font-size="16" font-weight="800" fill="#FFFFFF">麦当劳官方 MCP Server</text>
  <text x="120" y="67" font-size="11.5" fill="#FFD9D5">mcp.mcd.cn · order-list / query-meals / query-store-coupons / calculate-price / create-order</text>

  <!-- 连接线 -->
  <line x1="340" y1="80" x2="340" y2="104" stroke="#C9CED6" stroke-width="2.5"/>
  <path d="M334 100 L340 108 L346 100" fill="none" stroke="#C9CED6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 适配层 -->
  <rect x="140" y="108" width="400" height="52" rx="12" fill="#FFF7E0" stroke="#FFC72C" stroke-width="2"/>
  <text x="340" y="131" font-size="14" font-weight="800" fill="#A3150C" text-anchor="middle">adapter.py · 唯一适配层</text>
  <text x="340" y="150" font-size="11" fill="#5C4A12" text-anchor="middle">分↔元换算 ｜ 字段映射 ｜ 退款过滤 ｜ 营养匹配（算法层不接触原始响应）</text>

  <!-- 分叉 -->
  <line x1="340" y1="160" x2="340" y2="176" stroke="#C9CED6" stroke-width="2.5"/>
  <line x1="168" y1="176" x2="512" y2="176" stroke="#C9CED6" stroke-width="2.5"/>
  <line x1="168" y1="176" x2="168" y2="196" stroke="#C9CED6" stroke-width="2.5"/>
  <line x1="512" y1="176" x2="512" y2="196" stroke="#C9CED6" stroke-width="2.5"/>

  <!-- 链路 B -->
  <rect x="32" y="196" width="272" height="124" rx="14" fill="#F6F8FA" stroke="#DA291C" stroke-width="2"/>
  <rect x="32" y="196" width="272" height="34" rx="14" fill="#DA291C"/>
  <rect x="32" y="216" width="272" height="14" fill="#DA291C"/>
  <text x="48" y="220" font-size="13.5" font-weight="800" fill="#FFFFFF">🔗 链路 B · 长期「我吃了多少」</text>
  <text x="48" y="259" font-size="12.5" fill="#1F2328">auditor.py　历史订单 → 逐餐热量</text>
  <text x="48" y="281" font-size="12.5" fill="#1F2328">calendar_render.py　热量日历（文本+SVG）</text>
  <text x="48" y="303" font-size="12.5" fill="#1F2328">body.py　BMR / TDEE / 热量缺口</text>

  <!-- 链路 A -->
  <rect x="376" y="196" width="272" height="124" rx="14" fill="#F6F8FA" stroke="#FFC72C" stroke-width="2"/>
  <rect x="376" y="196" width="272" height="34" rx="14" fill="#FFC72C"/>
  <rect x="376" y="216" width="272" height="14" fill="#FFC72C"/>
  <text x="392" y="220" font-size="13.5" font-weight="800" fill="#3D2E00">🔗 链路 A · 单次「这一餐怎么吃」</text>
  <text x="392" y="259" font-size="12.5" fill="#1F2328">advisor.py　营养评分 + 组合枚举</text>
  <text x="392" y="281" font-size="12.5" fill="#1F2328">pricing.py　健康方案内比价（不为凑单）</text>
  <text x="392" y="303" font-size="12.5" fill="#1F2328">service.py　官方计价复核 + 一键下单</text>

  <!-- 算法层说明 -->
  <rect x="32" y="330" width="616" height="0" fill="none"/>
</svg>
